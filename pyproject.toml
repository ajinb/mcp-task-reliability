[project]
name = "mcp-task-reliability"
version = "0.1.0"
description = "The reliability layer the MCP Tasks extension does not specify — durable task store, retry classes, expiry and orphan reaping, and adaptive poll backoff for stateless MCP."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Ajin Baby" }]
keywords = ["mcp", "model-context-protocol", "tasks", "agents", "reliability", "sre", "long-running"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://cloudandsre.com"
Repository = "https://github.com/ajinb/mcp-task-reliability"

[project.scripts]
mcp-task-reliability = "mcp_task_reliability.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_task_reliability"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
